name: Prepare Minor Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prepare minor release 0.4.0 from main"
        required: true
        type: choice
        options:
          - "0.4.0"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    concurrency:
      group: prepare-minor-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare minor release
        uses: ./.github/actions/prepare-release
        with:
          release-type: minor
          release-version: ${{ inputs.version }}
          github-token: ${{ secrets.RELEASE_BOT_TOKEN }}
