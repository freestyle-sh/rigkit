name: Prepare Patch Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prepare patch release 0.3.1 from the matching version branch"
        required: true
        type: choice
        options:
          - "0.3.1"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    concurrency:
      group: prepare-patch-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare patch release
        uses: ./.github/actions/prepare-release
        with:
          release-type: patch
          release-version: ${{ inputs.version }}
          github-token: ${{ secrets.RELEASE_BOT_TOKEN }}
